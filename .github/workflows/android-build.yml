name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-latest runners ship a preinstalled, license-accepted
      # Android SDK (ANDROID_HOME / ANDROID_SDK_ROOT already set). The
      # android-actions/setup-android action tries to install the legacy
      # 'tools' package, which Google removed from the SDK repository, and
      # fails outright - so we skip it and just make sure the compileSdk
      # platform + matching build-tools are present via the preinstalled
      # sdkmanager.
      - name: Ensure required SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch llama.cpp sources
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-debug.apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
