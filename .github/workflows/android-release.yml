name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fetch llama.cpp sources
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp

      # NOTE: this produces an UNSIGNED release APK. Add a signing step with
      # secrets.KEYSTORE_* (GitHub Secrets) before distributing outside your
      # own device via `adb install`.
      - name: Build release APK (unsigned)
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyAI-release-unsigned.apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
